services:
  postgres:
    image: postgres:17

    container_name: dojo-db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dojo

    ports:
      - '5432:5432'
      

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
